name: Funktionsvorschlag
description: Neue Funktion oder Verbesserung vorschlagen
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Anwendungsfall
      description: Welches konkrete Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Vorschlag
      description: Wie könnte das gewünschte Verhalten aussehen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen
      description: Welche anderen Lösungen wurden erwogen?
  - type: checkboxes
    id: contribution
    attributes:
      label: Mitarbeit
      options:
        - label: Ich bin grundsätzlich bereit, nach vorheriger Abstimmung an der Umsetzung mitzuarbeiten.
